<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factores externos o macroambientales</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:transparent}
#fm-root{--ink:#104938;--light:#D1DE8C;--bg:#F4F9F4;--white:#fff;--line:#CFE3DA;width:100%;height:100%;min-height:450px;padding:7px 14px 9px;overflow:hidden;color:var(--ink);font-family:Montserrat,Arial,sans-serif}
#fm-root,#fm-root *{box-sizing:border-box}#fm-root button{margin:0;border:0;appearance:none;font:inherit}
.fm-layout{width:100%;height:100%;display:grid;grid-template-rows:minmax(0,1fr) 46px;gap:10px}

.fm-content{min-width:0;min-height:0;display:grid;grid-template-columns:38% 25% 37%;gap:11px}.fm-panel{min-width:0;min-height:0;overflow:hidden;border-radius:17px;box-shadow:0 8px 20px rgba(16,73,56,.13)}
.fm-intro{display:grid;grid-template-rows:7px auto minmax(0,1fr);background:var(--bg)}.fm-bar{background:#279371;transition:background .25s ease}.fm-head{display:flex;align-items:center;gap:12px;padding:11px 15px 7px}.fm-factor-icon{flex:0 0 48px;width:48px;height:48px;display:grid;place-items:center;border-radius:13px;color:#fff;background:#279371}.fm-factor-icon svg{width:31px;height:31px}.fm-kicker{font-size:20px;font-weight:700;line-height:1.1}.fm-title{margin-top:2px;font-size:22px;font-weight:700;line-height:1.16}
.fm-scroll{min-height:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:#279371 rgba(39,147,113,.12)}.fm-scroll::-webkit-scrollbar{width:7px}.fm-scroll::-webkit-scrollbar-track{background:rgba(39,147,113,.10);border-radius:999px}.fm-scroll::-webkit-scrollbar-thumb{background:#279371;border-radius:999px}
.fm-intro-body{padding:5px 17px 16px}.fm-p{margin:0 0 13px;font-size:20px;line-height:1.34}.fm-callout{margin:2px 0 0;padding:10px 12px;border-left:5px solid #279371;border-radius:10px;background:var(--light);font-size:20px;line-height:1.31}
.fm-nav{display:grid;grid-template-rows:auto minmax(0,1fr);background:#fff}.fm-nav-title{padding:13px 14px 9px;font-size:22px;font-weight:700;line-height:1.18}.fm-items{padding:0 12px 13px}.fm-item{width:100%;min-height:47px;margin-bottom:7px!important;padding:8px 10px!important;border-radius:11px!important;color:var(--ink)!important;background:var(--bg)!important;border:2px solid var(--line)!important;font-size:20px;font-weight:700;line-height:1.18;text-align:left;cursor:pointer}.fm-item.active{color:#fff!important;background:#279371!important;border-color:#279371!important}
.fm-detail{display:grid;grid-template-rows:7px auto minmax(0,1fr);background:var(--light)}.fm-detail-title{margin:0;padding:13px 17px 7px;font-size:22px;font-weight:700;line-height:1.18}.fm-detail-body{padding:4px 17px 15px}.fm-detail-text{margin:0;font-size:20px;line-height:1.36}.fm-detail-body.enter{animation:fmEnter .28s ease}@keyframes fmEnter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fm-footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;padding:0 4px}.fm-foot-btn{min-height:42px;padding:8px 20px!important;border-radius:999px!important;color:#fff!important;background:var(--ink)!important;font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 5px 12px rgba(16,73,56,.16)}.fm-foot-btn:disabled{opacity:.25}.fm-prev{justify-self:start}.fm-next{justify-self:end}.fm-status{min-width:210px;text-align:center;font-size:20px;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:999px;padding:7px 16px}
@media(max-width:900px){html,body{overflow:auto}#fm-root{min-height:980px;overflow:auto}.fm-layout{grid-template-rows:auto 46px}.fm-content{grid-template-columns:1fr}.fm-panel{min-height:300px}}
@media(prefers-reduced-motion:reduce){#fm-root *,#fm-root *:before,#fm-root *:after{animation:none!important;transition:none!important}}
</style></head>
<body><section id="fm-root"><div class="fm-layout">

<section class="fm-content"><article class="fm-panel fm-intro"><div class="fm-bar" id="barA"></div><div class="fm-head"><div class="fm-factor-icon" id="factorIcon"></div><div><div class="fm-kicker" id="kicker"></div><div class="fm-title" id="factorTitle"></div></div></div><div class="fm-scroll fm-intro-body" id="introBody"></div></article><aside class="fm-panel fm-nav"><div class="fm-nav-title">Indicadores y elementos</div><div class="fm-scroll fm-items" id="items"></div></aside><article class="fm-panel fm-detail"><div class="fm-bar" id="barB"></div><h2 class="fm-detail-title" id="detailTitle"></h2><div class="fm-scroll fm-detail-body" id="detailBody"></div></article></section>
<footer class="fm-footer"><button class="fm-foot-btn fm-prev" id="prev" type="button">← Factor anterior</button><div class="fm-status" id="status"></div><button class="fm-foot-btn fm-next" id="next" type="button">Factor siguiente →</button></footer>
</div></section>
<script>
const DATA=[{"title": "Factor socioeconómico", "color": "#279371", "icon": "chart", "back": ["PIB", "Tipo de cambio", "Inflación", "Empleo y salario"], "intro": ["El <strong>factor socioeconómico</strong> permite conocer las condiciones económicas del mercado destino y su impacto en el consumo, la <strong>capacidad de compra</strong> y la dinámica de la <strong>mercadotecnia internacional</strong>. Este factor ayuda a determinar si el mercado tiene condiciones económicas favorables para el producto o servicio que se desea ofrecer.", "En <strong>investigación de mercados</strong> internacional, los indicadores socioeconómicos permiten formular preguntas relacionadas con el <strong>potencial del mercado</strong>, la <strong>sensibilidad al precio</strong> y el perfil económico de los consumidores objetivo."], "items": [["Producto interno bruto (PIB)", "PIB", "El <strong>producto interno bruto</strong>, conocido como <strong>PIB</strong>, representa el valor total de los bienes y servicios producidos en un país durante un periodo determinado. Es un indicador del <strong>tamaño de la economía</strong> y su <strong>potencial del mercado</strong> (Cruz, 2015)."], ["Crecimiento del PIB", "Crecimiento del PIB", "El <strong>crecimiento del PIB</strong> muestra si una economía se encuentra en expansión, desaceleración o estancamiento. Una economía en crecimiento suele ofrecer condiciones más favorables para el consumo."], ["PIB per cápita", "PIB per cápita", "El <strong>PIB per cápita</strong> resulta de dividir el PIB entre el número de habitantes. Este indicador ofrece una aproximación al ingreso promedio de la población y permite estimar el nivel general de vida del mercado."], ["Distribución del ingreso", "Distribución del ingreso", "La <strong>distribución del ingreso</strong> permite conocer cómo se reparte la riqueza entre los distintos grupos de población. En <strong>investigación de mercados</strong>, este indicador ayuda a identificar si el <strong>segmento objetivo</strong> pertenece a un grupo con capacidad de compra suficiente para el producto ofrecido."], ["Tasa de interés", "Tasa de interés", "La <strong>tasa de interés</strong> representa el costo del dinero en operaciones de crédito, ahorro e inversión. Cuando las tasas de interés son altas, el crédito se encarece y el consumo puede reducirse."], ["Tipo de cambio", "Tipo de cambio", "El <strong>tipo de cambio</strong> expresa el valor de una moneda en relación con otra. En mercados internacionales, influye en precios, costos de importación, márgenes de ganancia y <strong>sensibilidad al precio</strong>. Su análisis es relevante en el <strong>diseño de investigación</strong> porque puede determinar si el precio del producto es competitivo en el mercado destino (Keegan y Green, 2020)."], ["Inflación", "Inflación", "La <strong>inflación</strong> consiste en el aumento generalizado y sostenido de precios. Cuando la inflación es alta, disminuye la <strong>capacidad de compra</strong> real de los consumidores. Este dato puede utilizarse en <strong>investigación de mercados</strong> para analizar el comportamiento del consumidor ante cambios en precios."], ["Tasa de empleo y nivel salarial", "Empleo y salario", "La <strong>tasa de empleo</strong> y el <strong>nivel salarial</strong> influyen directamente en el ingreso disponible de las familias. Un mercado con alta desocupación o salarios bajos puede presentar menor <strong>capacidad de compra</strong>."], ["Balanza de pagos", "Balanza de pagos", "La <strong>balanza de pagos</strong> registra las transacciones económicas de un país con el resto del mundo. En <strong>investigación de mercados internacional</strong>, puede indicar si el país tiende a importar o exportar ciertos tipos de productos."]]}, {"title": "Factores políticos", "color": "#156049", "icon": "government", "back": ["Riesgo político", "Política comercial", "Política fiscal", "Precios y tarifas"], "intro": ["Los <strong>factores políticos</strong> se relacionan con la estabilidad gubernamental, las políticas públicas, el grado de apertura comercial y el marco institucional de un país. En <strong>mercadotecnia internacional</strong>, estos factores determinan si el entorno político favorece o limita las operaciones empresariales en un mercado extranjero (Cateora et al., 2020).", "En <strong>investigación de mercados internacional</strong>, el análisis político ayuda a identificar riesgos, restricciones, oportunidades de acceso, fuentes de información gubernamental y posibles cambios en las condiciones del mercado."], "closing": "En conjunto, los factores políticos permiten anticipar si el ambiente institucional favorece o limita la entrada de una empresa a un mercado, y qué tipo de <strong>barreras de entrada</strong> de naturaleza política pueden enfrentarse.", "items": [["Riesgo político", "Riesgo político", "El <strong>riesgo político</strong> se refiere a la posibilidad de que decisiones gubernamentales, conflictos internos, cambios regulatorios o inestabilidad institucional afecten negativamente las operaciones de una empresa. Este riesgo debe considerarse en la <strong>investigación de mercados</strong> como una variable que puede modificar el atractivo del mercado."], ["Política comercial", "Política comercial", "La <strong>política comercial</strong> comprende las decisiones gubernamentales relacionadas con importaciones, exportaciones, tratados, aranceles, subsidios y acuerdos bilaterales o multilaterales. Puede facilitar o dificultar el acceso a un mercado."], ["Política cambiaria", "Política cambiaria", "La <strong>política cambiaria</strong> se relaciona con las decisiones que influyen en el comportamiento de la moneda nacional frente a monedas extranjeras. Puede afectar los precios, la competitividad y los costos del comercio internacional."], ["Política fiscal", "Política fiscal", "La <strong>política fiscal</strong> se refiere a las decisiones del Estado sobre impuestos, gasto público, derechos, contribuciones y endeudamiento. En <strong>investigación de mercados</strong>, el entorno fiscal puede influir en la rentabilidad y en los precios al consumidor."], ["Política monetaria y crediticia", "Monetaria y crediticia", "La <strong>política monetaria y crediticia</strong> busca regular la cantidad de dinero, el crédito y las tasas de interés para mantener la estabilidad económica. Su análisis es relevante en el <strong>diseño de investigación</strong> cuando se estudian variables de consumo y acceso al crédito."], ["Política de precios y tarifas", "Precios y tarifas", "La <strong>política de precios y tarifas</strong> incluye regulaciones o controles gubernamentales sobre ciertos bienes y servicios. Puede afectar directamente la estrategia de precios de una empresa en el mercado internacional y debe contemplarse en la <strong>investigación de mercados</strong>."]]}, {"title": "Factor demográfico", "color": "#3F9089", "icon": "people", "back": ["Tamaño de población", "Estructura de edad", "Ocupación", "Concentración poblacional"], "intro": ["El <strong>factor demográfico</strong> permite analizar las características de la población de un mercado. En <strong>mercadotecnia internacional</strong>, es uno de los factores más relevantes para la segmentación, el posicionamiento y la adaptación del producto, ya que la composición de la población determina el tamaño, la naturaleza y las características de la demanda potencial (Kotler y Keller, 2016).", "En <strong>investigación de mercados internacional</strong>, los datos demográficos permiten definir el <strong>público objetivo</strong>, construir perfiles de consumidor, delimitar el universo de estudio y determinar el método de muestreo. También orientan la selección de variables del <strong>problema de investigación</strong>."], "items": [["Tamaño de la población", "Tamaño de la población", "El <strong>tamaño de la población</strong> permite estimar el número potencial de consumidores dentro de un mercado."], ["Tasas de natalidad y mortalidad", "Natalidad y mortalidad", "Las <strong>tasas de natalidad y mortalidad</strong> muestran cambios en el crecimiento o reducción de la población, relevantes para proyecciones de demanda a mediano y largo plazo."], ["Estructura de edad", "Estructura de edad", "La <strong>estructura de edad</strong> muestra cómo se distribuye la población por rangos de edad, lo que permite identificar segmentos prioritarios como jóvenes, adultos o adultos mayores."], ["Género", "Género", "El <strong>género</strong> puede ser una variable de segmentación cuando el producto, la comunicación o los hábitos de consumo presentan diferencias significativas entre grupos."], ["Tamaño y número de familias", "Tamaño de familias", "El <strong>tamaño y número de familias</strong> influye en el volumen de consumo, el tipo de productos adquiridos y la frecuencia de compra."], ["Ocupación", "Ocupación", "La <strong>ocupación</strong> permite conocer actividades laborales predominantes y puede relacionarse con ingresos, estilos de vida, horarios y consumo específico. En <strong>investigación de mercados internacional</strong>, permite segmentar por tipo de actividad económica."], ["Nivel educativo", "Nivel educativo", "El <strong>nivel educativo</strong> influye en el acceso a información, comprensión de mensajes, consumo de productos especializados y adopción de innovaciones."], ["Movimientos de población", "Movimientos de población", "Los <strong>movimientos de población</strong>, como migración interna o internacional, modifican el tamaño y composición de los mercados."], ["Concentración de la población", "Concentración poblacional", "La <strong>concentración de la población</strong> permite identificar zonas urbanas y posibles áreas de distribución, lo que puede influir en el <strong>trabajo de campo</strong> de una investigación."]]}, {"title": "Factores legales", "color": "#104938", "icon": "scale", "back": ["Arancelarias", "No arancelarias", "Medidas sanitarias", "Proteccionistas"], "intro": ["Los <strong>factores legales</strong> comprenden leyes, reglamentos, normas, decretos y disposiciones que regulan la actividad comercial en un país. Estos factores determinan qué se puede vender, cómo debe comercializarse, qué requisitos debe cumplir el producto y qué restricciones existen para operar en el mercado (Keegan y Green, 2020).", "En <strong>investigación de mercados internacional</strong>, el análisis legal permite identificar restricciones, requisitos, riesgos de incumplimiento y condiciones normativas que deben considerarse en la <strong>estrategia de entrada</strong>."], "closing": "Los factores legales permiten que la <strong>investigación de mercados</strong> no se limite al interés del consumidor, sino que considere la viabilidad normativa y regulatoria del producto en el mercado destino.", "items": [["Disposiciones arancelarias", "Disposiciones arancelarias", "Las <strong>disposiciones arancelarias</strong> se relacionan con impuestos o tarifas aplicadas a la importación o exportación de bienes. Pueden encarecer el producto en el mercado destino."], ["Disposiciones no arancelarias", "Disposiciones no arancelarias", "Las <strong>disposiciones no arancelarias</strong> son requisitos que un país impone para permitir el ingreso de mercancías, como permisos previos, cuotas, certificaciones o procesos de homologación."], ["Medidas sanitarias y reglamentos técnicos", "Medidas sanitarias", "Las <strong>medidas sanitarias</strong> buscan proteger la salud de la población, mientras que los <strong>reglamentos técnicos</strong> establecen características obligatorias para productos (materiales, etiquetado, embalaje)."], ["Medidas proteccionistas", "Medidas proteccionistas", "Las <strong>medidas proteccionistas</strong> son acciones que buscan limitar el ingreso de productos extranjeros o proteger sectores locales, como subsidios, cuotas de importación o barreras administrativas."]]}, {"title": "Factores culturales", "color": "#93C01F", "icon": "culture", "back": ["Valores", "Idioma", "Actitudes", "Religión y creencias"], "intro": ["Los <strong>factores culturales</strong> incluyen valores, idioma, creencias, actitudes, religión, estética, símbolos, hábitos y normas sociales que caracterizan a una sociedad. En <strong>mercadotecnia internacional</strong>, la cultura influye en la forma en que los consumidores perciben, evalúan y adoptan productos, marcas y mensajes (Cateora et al., 2020).", "En <strong>investigación de mercados internacional</strong>, el factor cultural influye en el diseño de instrumentos, la traducción de preguntas, la interpretación de respuestas, la selección de técnicas de recolección y la adaptación de los hallazgos al contexto local."], "closing": "Los factores culturales obligan a que la <strong>investigación de mercados internacional</strong> considere no solo qué consume una población, sino cómo y por qué lo consume.", "items": [["Valores", "Valores", "Los <strong>valores</strong> orientan lo que una sociedad considera deseable, correcto, importante o aceptable. En <strong>investigación de mercados</strong>, los valores pueden influir en las respuestas de los participantes y en las preferencias de consumo."], ["Idioma", "Idioma", "El <strong>idioma</strong> es fundamental para diseñar cuestionarios, entrevistas y grupos focales en contextos internacionales. Las diferencias lingüísticas pueden generar errores de interpretación si no se consideran adecuadamente."], ["Actitudes", "Actitudes", "Las <strong>actitudes</strong> reflejan predisposiciones favorables o desfavorables hacia productos, marcas, prácticas, países de origen o empresas. Deben explorarse con instrumentos culturalmente adaptados."], ["Estética", "Estética", "La <strong>estética</strong> se relaciona con preferencias sobre colores, formas, diseño, música, imágenes y símbolos. Estos elementos pueden variar significativamente entre culturas."], ["Religión y creencias", "Religión y creencias", "La <strong>religión y las creencias</strong> pueden influir en hábitos alimenticios, formas de vestir, consumo de ciertos productos, horarios de actividad y actitudes ante determinadas propuestas comerciales. En <strong>investigación de mercados</strong>, ignorar estos factores puede llevar a conclusiones incorrectas."]]}, {"title": "Factores tecnológicos", "color": "#279371", "icon": "tech", "back": ["Recolección digital", "Innovación", "Productividad", "Distribución"], "intro": ["Los <strong>factores tecnológicos</strong> se relacionan con el nivel de desarrollo, acceso, uso e incorporación de tecnologías en un mercado. Este factor influye tanto en la operación de las empresas como en los hábitos y comportamientos de los consumidores.", "En <strong>mercadotecnia internacional</strong>, la tecnología influye en el desarrollo de productos, la distribución, la promoción, la <strong>recolección de información</strong> y el <strong>diseño de investigación</strong> (Lerma y Márquez, 2010).", "En <strong>investigación de mercados internacional</strong>, este factor determina si es viable utilizar encuestas en línea, entrevistas virtuales, análisis de datos digitales u otros métodos de recolección que requieren infraestructura tecnológica."], "items": [["Innovación", "Innovación", "La <strong>innovación</strong> permite identificar si el mercado acepta nuevos productos, tecnologías o modelos de negocio."], ["Productividad y sistemas de distribución", "Productividad y distribución", "La <strong>productividad</strong> y los <strong>sistemas de distribución</strong> también pueden verse influidos por el nivel tecnológico del entorno."], ["Diseño de investigación", "Diseño de investigación", "Para el <strong>diseño de investigación</strong>, el factor tecnológico permite decidir si la <strong>recolección de datos</strong> se realizará mediante métodos en línea, presenciales o mixtos, así como si existen datos secundarios digitales disponibles para el mercado objetivo."]]}, {"title": "Factores geográficos", "color": "#156049", "icon": "globe", "back": ["Superficie", "Localización", "Litoral", "Clima"], "intro": ["Los <strong>factores geográficos</strong> comprenden las condiciones físicas y territoriales de un país o región, como localización, superficie, relieve, clima, recursos naturales, litoral e infraestructura de transporte y comunicaciones (Cateora et al., 2020).", "En <strong>investigación de mercados internacional</strong>, el análisis geográfico permite identificar condiciones de acceso, costos logísticos, zonas de mayor concentración de consumidores y viabilidad física de atender el mercado."], "closing": "Los factores geográficos permiten que la <strong>investigación de mercados</strong> considere la viabilidad física y logística de atender un mercado, lo cual es fundamental cuando se diseñan estrategias de distribución o se seleccionan zonas de estudio para el trabajo de campo.", "items": [["Superficie y localización geográfica", "Superficie y localización", "La <strong>superficie o territorio</strong> permite conocer la extensión del mercado y la disponibilidad de recursos naturales. La <strong>localización geográfica</strong> del país puede facilitar o complicar el transporte de mercancías y la comunicación."], ["Litoral", "Litoral", "El <strong>litoral</strong> puede facilitar actividades de comercio marítimo, logística portuaria y acceso a recursos marinos, lo que puede ser relevante para sectores específicos."], ["Clima", "Clima", "El <strong>clima</strong> puede modificar el uso, conservación, empaque, transporte y consumo de productos, especialmente alimentos, cosméticos, textiles y productos de temporada."], ["Flora, fauna y recursos minerales", "Flora, fauna y minerales", "La <strong>flora, fauna y los recursos minerales</strong> influyen en actividades productivas, disponibilidad de materias primas y exportaciones del mercado."]]}];const ICONS={"chart": "<svg viewBox=\"0 0 64 64\"><path d=\"M9 52h46\"/><path d=\"M14 46V34h8v12M28 46V24h8v22M42 46V15h8v31\"/><path d=\"M13 23l12-6 11 5 15-11\"/><path d=\"M44 10h7v7\"/></svg>", "government": "<svg viewBox=\"0 0 64 64\"><path d=\"M8 52h48M12 26h40\"/><path d=\"M16 26v22M27 26v22M37 26v22M48 26v22\"/><path d=\"M9 26L32 10l23 16zM6 56h52\"/></svg>", "people": "<svg viewBox=\"0 0 64 64\"><circle cx=\"32\" cy=\"17\" r=\"8\"/><circle cx=\"15\" cy=\"25\" r=\"6\"/><circle cx=\"49\" cy=\"25\" r=\"6\"/><path d=\"M20 52v-7c0-8 5-14 12-14s12 6 12 14v7\"/><path d=\"M6 52v-5c0-7 4-12 9-12 4 0 7 2 9 6\"/><path d=\"M58 52v-5c0-7-4-12-9-12-4 0-7 2-9 6\"/></svg>", "scale": "<svg viewBox=\"0 0 64 64\"><path d=\"M12 54h40M32 10v44M18 18h28\"/><path d=\"M18 18l-9 17h18zM46 18l-9 17h18zM22 54h20\"/></svg>", "culture": "<svg viewBox=\"0 0 64 64\"><path d=\"M13 12h38v29H31L19 52V41h-6z\"/><path d=\"M21 22h22M21 30h15\"/><circle cx=\"46\" cy=\"48\" r=\"8\"/><path d=\"M46 43v10M41 48h10\"/></svg>", "tech": "<svg viewBox=\"0 0 64 64\"><rect x=\"11\" y=\"13\" width=\"42\" height=\"30\" rx=\"4\"/><path d=\"M22 52h20M32 43v9\"/><path d=\"M19 28h7l4-7 7 14 4-7h5\"/></svg>", "globe": "<svg viewBox=\"0 0 64 64\"><circle cx=\"32\" cy=\"32\" r=\"22\"/><path d=\"M10 32h44M32 10c7 6 11 13 11 22S39 48 32 54M32 10c-7 6-11 13-11 22s4 16 11 22\"/><path d=\"M16 20c6 4 26 4 32 0M16 44c6-4 26-4 32 0\"/></svg>"};
const factorIcon=document.getElementById('factorIcon'),kicker=document.getElementById('kicker'),factorTitle=document.getElementById('factorTitle'),introBody=document.getElementById('introBody'),barA=document.getElementById('barA'),barB=document.getElementById('barB'),items=document.getElementById('items'),detailTitle=document.getElementById('detailTitle'),detailBody=document.getElementById('detailBody'),prev=document.getElementById('prev'),next=document.getElementById('next'),status=document.getElementById('status');
let current=0;


function showDetail(i){const item=DATA[current].items[i];[...items.children].forEach((b,j)=>b.classList.toggle('active',j===i));detailTitle.textContent=item[0];detailBody.classList.remove('enter');detailBody.innerHTML=`<p class="fm-detail-text">${item[2]}</p>`;detailBody.scrollTop=0;requestAnimationFrame(()=>detailBody.classList.add('enter'))}
function showFactor(i){current=Math.max(0,Math.min(i,DATA.length-1));const f=DATA[current];factorIcon.innerHTML=ICONS[f.icon];factorIcon.style.background=f.color;barA.style.background=f.color;barB.style.background=f.color;kicker.textContent=`${current+1} de 7`;factorTitle.textContent=f.title;introBody.innerHTML=f.intro.map(p=>`<p class="fm-p">${p}</p>`).join('')+(f.closing?`<p class="fm-callout" style="border-left-color:${f.color}">${f.closing}</p>`:'');introBody.scrollTop=0;items.innerHTML=f.items.map((it,j)=>`<button type="button" class="fm-item ${j===0?'active':''}" data-j="${j}">${it[1]}</button>`).join('');items.scrollTop=0;showDetail(0);status.textContent=`${current+1} de 7`;prev.disabled=current===0;next.disabled=current===DATA.length-1}
items.addEventListener('click',e=>{
  const b=e.target.closest('.fm-item');
  if(b) showDetail(Number(b.dataset.j));
});
prev.addEventListener('click',()=>showFactor(current-1));
next.addEventListener('click',()=>showFactor(current+1));
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') showFactor(current-1);
  if(e.key==='ArrowRight') showFactor(current+1);
});
document.fonts.ready.then(()=>showFactor(0));
</script></body></html>

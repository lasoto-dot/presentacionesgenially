<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factores internos de la empresa</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

<style>
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:transparent;
}

#fi-root{
  --fi-verde:#279371;
  --fi-politico:#156049;
  --fi-medio:#3F9089;
  --fi-lima:#93C01F;
  --fi-oscuro:#104938;
  --fi-claro:#D1DE8C;
  --fi-fondo:#F4F9F4;
  --fi-blanco:#FFFFFF;
  --fi-borde:#CFE3DA;

  width:100%;
  height:100%;
  min-height:450px;
  padding:8px 14px 10px;
  overflow:hidden;
  color:var(--fi-oscuro);
  background:transparent;
  font-family:"Montserrat",Arial,sans-serif;
  box-sizing:border-box;
}

#fi-root,
#fi-root *{
  box-sizing:border-box;
}

#fi-root button{
  margin:0;
  border:0;
  appearance:none;
  -webkit-appearance:none;
  font:inherit;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}

.fi-layout{
  width:100%;
  height:100%;
  min-height:0;
  display:grid;
  grid-template-rows:138px minmax(0,1fr) 42px;
  gap:10px;
}

/* ==========================================================
   TARJETAS
========================================================== */
.fi-cards{
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:12px;
}

.fi-card{
  position:relative;
  min-width:0;
  height:100%;
  padding:14px 16px !important;
  display:grid;
  grid-template-columns:58px minmax(0,1fr);
  align-items:center;
  gap:13px;
  border-radius:18px !important;
  color:#FFFFFF !important;
  cursor:pointer;
  box-shadow:0 7px 17px rgba(16,73,56,.13);
  opacity:0;
  animation:fi-card-in .38s ease forwards;
  transition:box-shadow .18s ease,filter .18s ease;
}

.fi-card:nth-child(1){animation-delay:.06s}
.fi-card:nth-child(2){animation-delay:.18s}
.fi-card:nth-child(3){animation-delay:.30s}
.fi-card:nth-child(4){animation-delay:.42s}

@keyframes fi-card-in{
  to{opacity:1}
}

.fi-card:hover{
  filter:brightness(1.04);
  box-shadow:0 10px 22px rgba(16,73,56,.18);
}

.fi-card:focus-visible{
  outline:3px solid var(--fi-claro);
  outline-offset:3px;
}

.fi-card.fi-active::after{
  content:"";
  position:absolute;
  left:50%;
  bottom:-10px;
  width:0;
  height:0;
  border-left:12px solid transparent;
  border-right:12px solid transparent;
  border-top:12px solid var(--fi-card-color);
  transform:translateX(-50%);
}

.fi-card-icon{
  width:58px;
  height:58px;
  display:grid;
  place-items:center;
  border-radius:16px;
  background:rgba(255,255,255,.16);
}

.fi-card-icon svg{
  width:38px;
  height:38px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.35;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.fi-card-title{
  min-width:0;
  font-size:22px;
  font-weight:700;
  line-height:1.16;
  text-align:left;
  overflow-wrap:anywhere;
}

/* ==========================================================
   PANEL INFORMATIVO
========================================================== */
.fi-detail{
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-columns:31% 69%;
  overflow:hidden;
  border-radius:19px;
  background:var(--fi-fondo);
  box-shadow:0 8px 20px rgba(16,73,56,.12);
}

.fi-detail-side{
  min-width:0;
  min-height:0;
  padding:18px 20px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:14px;
  color:#FFFFFF;
  background:var(--fi-verde);
  text-align:center;
  transition:background .18s ease;
}

.fi-detail-icon{
  width:82px;
  height:82px;
  display:grid;
  place-items:center;
  border-radius:22px;
  background:rgba(255,255,255,.16);
}

.fi-detail-icon svg{
  width:52px;
  height:52px;
  fill:none;
  stroke:currentColor;
  stroke-width:2.2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

.fi-detail-title{
  margin:0;
  max-width:280px;
  font-size:22px;
  font-weight:700;
  line-height:1.18;
}

.fi-detail-body{
  min-width:0;
  min-height:0;
  overflow-y:auto;
  padding:20px 25px 21px;
  background:var(--fi-fondo);
  scrollbar-width:thin;
  scrollbar-color:var(--fi-verde) rgba(39,147,113,.14);
}

.fi-detail-body::-webkit-scrollbar{
  width:7px;
}

.fi-detail-body::-webkit-scrollbar-track{
  background:rgba(39,147,113,.12);
  border-radius:999px;
}

.fi-detail-body::-webkit-scrollbar-thumb{
  background:var(--fi-verde);
  border-radius:999px;
}

.fi-detail-body.fi-enter{
  animation:fi-detail-in .23s ease;
}

@keyframes fi-detail-in{
  from{opacity:0}
  to{opacity:1}
}

.fi-p{
  margin:0 0 15px;
  font-size:20px;
  font-weight:400;
  line-height:1.38;
}

.fi-p:last-child{
  margin-bottom:0;
}

/* ==========================================================
   NAVEGACIÓN
========================================================== */
.fi-footer{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:14px;
}

.fi-arrow{
  min-height:40px;
  padding:8px 18px !important;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  border-radius:999px !important;
  color:var(--fi-oscuro) !important;
  background:var(--fi-claro) !important;
  font-size:20px;
  font-weight:700;
  line-height:1.1;
  cursor:pointer;
  box-shadow:0 5px 12px rgba(16,73,56,.12);
}

.fi-arrow:hover{
  filter:brightness(.98);
}

.fi-prev{justify-self:start}
.fi-next{justify-self:end}

.fi-status{
  min-width:110px;
  padding:7px 15px;
  border:2px solid var(--fi-borde);
  border-radius:999px;
  background:#FFFFFF;
  font-size:20px;
  font-weight:700;
  text-align:center;
}

@media(max-width:900px){
  html,body{overflow:auto}

  #fi-root{
    min-height:980px;
    overflow:auto;
  }

  .fi-layout{
    grid-template-rows:auto auto 44px;
  }

  .fi-cards{
    grid-template-columns:repeat(2,minmax(0,1fr));
  }

  .fi-card{
    min-height:120px;
  }

  .fi-detail{
    grid-template-columns:1fr;
  }

  .fi-detail-side{
    min-height:180px;
  }

  .fi-detail-body{
    min-height:330px;
  }
}

@media(prefers-reduced-motion:reduce){
  #fi-root *,
  #fi-root *::before,
  #fi-root *::after{
    animation:none !important;
    transition:none !important;
  }

  .fi-card{
    opacity:1;
  }
}
</style>
</head>

<body>
<section id="fi-root" aria-label="Factores internos de la empresa">
  <div class="fi-layout">

    <section class="fi-cards" aria-label="Carrusel de factores internos de la empresa">
      <button class="fi-card fi-active" type="button" data-index="0" style="background:#279371;--fi-card-color:#279371">
        <span class="fi-card-icon">
          <svg viewBox="0 0 64 64">
            <circle cx="32" cy="32" r="22"/>
            <path d="M32 18v28M39 23c-2-3-5-5-9-5-5 0-9 3-9 7 0 5 4 6 11 8 7 2 11 4 11 9 0 4-4 7-10 7-5 0-9-2-12-6"/>
          </svg>
        </span>
        <span class="fi-card-title">Recursos financieros</span>
      </button>

      <button class="fi-card" type="button" data-index="1" style="background:#156049;--fi-card-color:#156049">
        <span class="fi-card-icon">
          <svg viewBox="0 0 64 64">
            <circle cx="30" cy="31" r="19"/>
            <circle cx="30" cy="31" r="11"/>
            <circle cx="30" cy="31" r="4"/>
            <path d="M42 19l12-9M45 10h9v9"/>
          </svg>
        </span>
        <span class="fi-card-title">Estrategia de marketing</span>
      </button>

      <button class="fi-card" type="button" data-index="2" style="background:#3F9089;--fi-card-color:#3F9089">
        <span class="fi-card-icon">
          <svg viewBox="0 0 64 64">
            <path d="M10 52h44"/>
            <path d="M15 45V31h8v14M28 45V22h8v23M41 45V14h8v31"/>
            <circle cx="45" cy="20" r="10"/>
            <path d="M52 27l7 7"/>
          </svg>
        </span>
        <span class="fi-card-title">Capacidad de análisis</span>
      </button>

      <button class="fi-card" type="button" data-index="3" style="background:#93C01F;--fi-card-color:#93C01F">
        <span class="fi-card-icon">
          <svg viewBox="0 0 64 64">
            <circle cx="22" cy="23" r="7"/>
            <circle cx="42" cy="23" r="7"/>
            <circle cx="32" cy="17" r="7"/>
            <path d="M9 50v-6c0-8 5-13 13-13M55 50v-6c0-8-5-13-13-13"/>
            <path d="M20 50v-7c0-9 5-15 12-15s12 6 12 15v7"/>
          </svg>
        </span>
        <span class="fi-card-title">Cultura organizacional</span>
      </button>
    </section>

    <article class="fi-detail" aria-live="polite">
      <div class="fi-detail-side" id="fi-side">
        <div class="fi-detail-icon" id="fi-icon" aria-hidden="true"></div>
        <h2 class="fi-detail-title" id="fi-title"></h2>
      </div>
      <div class="fi-detail-body" id="fi-body"></div>
    </article>

    <footer class="fi-footer">
      <button class="fi-arrow fi-prev" id="fi-prev" type="button">← Anterior</button>
      <div class="fi-status" id="fi-status">1 de 4</div>
      <button class="fi-arrow fi-next" id="fi-next" type="button">Siguiente →</button>
    </footer>

  </div>
</section>

<script>
const FI_ICONOS = {
  recursos:`
    <svg viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="22"/>
      <path d="M32 18v28M39 23c-2-3-5-5-9-5-5 0-9 3-9 7 0 5 4 6 11 8 7 2 11 4 11 9 0 4-4 7-10 7-5 0-9-2-12-6"/>
    </svg>`,
  estrategia:`
    <svg viewBox="0 0 64 64">
      <circle cx="30" cy="31" r="19"/>
      <circle cx="30" cy="31" r="11"/>
      <circle cx="30" cy="31" r="4"/>
      <path d="M42 19l12-9M45 10h9v9"/>
    </svg>`,
  analisis:`
    <svg viewBox="0 0 64 64">
      <path d="M10 52h44"/>
      <path d="M15 45V31h8v14M28 45V22h8v23M41 45V14h8v31"/>
      <circle cx="45" cy="20" r="10"/>
      <path d="M52 27l7 7"/>
    </svg>`,
  cultura:`
    <svg viewBox="0 0 64 64">
      <circle cx="22" cy="23" r="7"/>
      <circle cx="42" cy="23" r="7"/>
      <circle cx="32" cy="17" r="7"/>
      <path d="M9 50v-6c0-8 5-13 13-13M55 50v-6c0-8-5-13-13-13"/>
      <path d="M20 50v-7c0-9 5-15 12-15s12 6 12 15v7"/>
    </svg>`
};

const FI_DATA = [
  {
    titulo:"Recursos financieros",
    color:"#279371",
    icono:"recursos",
    texto:[
      `Los <strong>recursos financieros</strong> determinan el alcance, profundidad y método de la investigación. Una empresa con mayor presupuesto puede combinar <strong>trabajo de campo</strong> internacional con <strong>investigación secundaria</strong>, mientras que una empresa con recursos limitados podría restringirse a fuentes secundarias y técnicas exploratorias de bajo costo.`,
      `Este factor influye en decisiones como el tipo de investigación, el tamaño de la muestra, el número de países a comparar, el uso de herramientas de investigación digital y la contratación de consultoras especializadas en el <strong>diseño de investigación</strong>.`
    ]
  },
  {
    titulo:"Estrategia de marketing",
    color:"#156049",
    icono:"estrategia",
    texto:[
      `La <strong>estrategia de marketing</strong> define el propósito de la investigación. Si la empresa busca ingresar a un nuevo mercado, la investigación debe identificar barreras, segmentos y condiciones de entrada. Si busca reposicionarse, debe explorar percepciones, imagen de marca y competencia. En ambos casos, la <strong>estrategia de marketing</strong> orienta las preguntas y el foco del estudio.`,
      `Por ello, la investigación debe diseñarse en función de la decisión estratégica que la empresa necesita tomar. Una investigación sin alineación estratégica puede generar datos que no son útiles para la toma de decisiones.`
    ]
  },
  {
    titulo:"Capacidad de análisis",
    color:"#3F9089",
    icono:"analisis",
    texto:[
      `La <strong>capacidad de análisis</strong> se refiere a la habilidad de la empresa para interpretar datos y convertirlos en información útil para la <strong>toma de decisiones</strong>. Esta capacidad incluye el uso de herramientas estadísticas, software de análisis, habilidades del equipo de investigación y procesos de síntesis de información.`,
      `En <strong>investigación de mercados</strong> internacional, esta capacidad es importante porque los datos pueden provenir de fuentes diversas, con formatos distintos y en diferentes idiomas. Un equipo con mayor capacidad analítica puede extraer más valor de los datos recopilados y adaptarlos mejor al <strong>entorno de negocios</strong>.`
    ]
  },
  {
    titulo:"Cultura organizacional",
    color:"#93C01F",
    icono:"cultura",
    texto:[
      `La <strong>cultura organizacional</strong> influye en la forma en que la empresa utiliza la información. Una organización abierta al aprendizaje, la innovación y la adaptación tenderá a utilizar los resultados de la investigación para ajustar sus decisiones. Una organización con estructuras rígidas puede ignorar hallazgos que contradicen sus supuestos previos.`,
      `Este factor es importante porque la <strong>investigación de mercados</strong> no solo consiste en obtener datos, sino en utilizarlos para mejorar decisiones. Si la cultura organizacional no favorece el uso de evidencia, la investigación pierde su valor estratégico.`
    ]
  }
];

const fiRoot = document.getElementById("fi-root");
const fiCards = fiRoot.querySelectorAll(".fi-card");
const fiSide = document.getElementById("fi-side");
const fiIcon = document.getElementById("fi-icon");
const fiTitle = document.getElementById("fi-title");
const fiBody = document.getElementById("fi-body");
const fiStatus = document.getElementById("fi-status");
const fiPrev = document.getElementById("fi-prev");
const fiNext = document.getElementById("fi-next");

let fiCurrent = 0;

function fiShow(index){
  fiCurrent = (index + FI_DATA.length) % FI_DATA.length;
  const factor = FI_DATA[fiCurrent];

  fiCards.forEach((card,i)=>{
    const active = i === fiCurrent;
    card.classList.toggle("fi-active",active);
    card.setAttribute("aria-pressed",active ? "true" : "false");
  });

  fiSide.style.background = factor.color;
  fiIcon.innerHTML = FI_ICONOS[factor.icono];
  fiTitle.textContent = factor.titulo;

  fiBody.classList.remove("fi-enter");
  fiBody.innerHTML = factor.texto.map(p=>`<p class="fi-p">${p}</p>`).join("");
  fiBody.scrollTop = 0;
  requestAnimationFrame(()=>fiBody.classList.add("fi-enter"));

  fiStatus.textContent = `${fiCurrent+1} de 4`;
}

fiRoot.addEventListener("click",event=>{
  const card = event.target.closest(".fi-card");
  if(card && fiRoot.contains(card)){
    event.preventDefault();
    fiShow(Number(card.dataset.index));
    return;
  }

  if(event.target.closest("#fi-prev")){
    event.preventDefault();
    fiShow(fiCurrent-1);
    return;
  }

  if(event.target.closest("#fi-next")){
    event.preventDefault();
    fiShow(fiCurrent+1);
  }
});

document.addEventListener("keydown",event=>{
  if(event.key === "ArrowLeft") fiShow(fiCurrent-1);
  if(event.key === "ArrowRight") fiShow(fiCurrent+1);
});

document.fonts.ready.then(()=>fiShow(0));
</script>
</body>
</html>
